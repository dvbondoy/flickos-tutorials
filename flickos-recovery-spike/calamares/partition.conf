# Spike config (FlickOS has no partition.conf today, so Calamares uses its
# built-in defaults). Only the filesystem keys are new; the others repeat
# Calamares's defaults so nothing else changes.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB

# A swap partition, never a swap file: hibernation (resume=) with a btrfs
# swap file needs its offset worked out (design ADR-001).
userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks1

initialPartitioningChoice: none

# New: btrfs by default, ext4 still offered in the "Erase disk" drop-down.
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:  ["btrfs", "ext4"]
